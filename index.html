  <style>
    /* Optional: Slight hover scale to show it's clickable */
        .floating:hover {
        cursor: pointer;
        filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
        }

        /* 2. Portal Transition Effect */
        /* This shrinks, spins, and fades out the wrapper as if disappearing into a vortex */
        .portal-vortex {
        animation: portalCollapse 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }

        @keyframes portalCollapse {
        0% {
            transform: scale(1) rotate(0deg);
            opacity: 1;
            filter: blur(0px);
        }
        50% {
            filter: blur(4px);
        }
        100% {
            transform: scale(0) rotate(720deg); /* Spins twice and shrinks to nothing */
            opacity: 0;
            filter: blur(10px);
        }
        }
  </style>

                      <a href="about.html" id="portal-link" class="position-relative d-inline-block text-decoration-none">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

  <script>
    document.getElementById('portal-link').addEventListener('click', function(e) {
  // 1. Stop the page from changing immediately
  e.preventDefault();
  
  const destination = this.href;
  const logoWrapper = document.querySelector('.logo-wrapper');
  
  // 2. Add the CSS class that triggers the portal vortex animation
  logoWrapper.classList.add('portal-vortex');
  
  // 3. Wait 800 milliseconds (matching the CSS animation duration) then navigate
  setTimeout(function() {
    window.location.href = destination;
  }, 800);
});

  </script>
